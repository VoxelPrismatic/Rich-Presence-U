name: Pre-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^const VERSION = "\(.*\)"/\1/p' svc/version.go | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read VERSION from svc/version.go"
            exit 1
          fi
          case "$VERSION" in
            v*) TAG="$VERSION" ;;
            *)  TAG="v$VERSION" ;;
          esac
          echo "VERSION=$VERSION"
          echo "TAG=$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump VERSION in svc/version.go."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump VERSION in svc/version.go."
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rich-presence-qt_linux
          - os: macos-latest
            artifact: rich-presence-qt_macOS.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ pkg-config qt6-base-dev qt6-svg-dev libqt6svg6 libgl1-mesa-dev libxkbcommon-dev

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install qt pkg-config
          QT_PREFIX="$(brew --prefix qt)"
          echo "PATH=${QT_PREFIX}/bin:${PATH}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${QT_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${QT_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I${QT_PREFIX}/include" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-std=c++17" >> "$GITHUB_ENV"
          echo "CGO_CXXFLAGS=-std=c++17" >> "$GITHUB_ENV"

      - name: Build
        env:
          CGO_ENABLED: 1
        run: |
          go build -o rpqt .
          go build -tags portable -o rpqt-portable .

      - name: Package
        run: cp rpqt "${{ matrix.artifact }}"

      - name: Package portable (Linux)
        if: runner.os == 'Linux'
        run: bash .github/scripts/pack-linux-portable.sh rpqt-portable 'rich-presence-qt_linux_(portable)'

      - name: Package portable (macOS)
        if: runner.os == 'macOS'
        run: bash .github/scripts/pack-macos-portable.sh rpqt-portable 'rich-presence-qt_macOS_(portable).app'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: rich-presence-qt_linux_(portable)
          path: rich-presence-qt_linux_(portable)
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: rich-presence-qt_macOS_(portable)
          path: rich-presence-qt_macOS_(portable).app.zip
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        shell: msys2 {0}
        env:
          CGO_ENABLED: 1
        run: |
          export PATH="/ucrt64/bin:$PATH"
          go build -ldflags "-s -w -H windowsgui" -o rich-presence-qt_windows.exe .
          mkdir dist-win
          go build -tags portable -ldflags "-s -w -H windowsgui" -o dist-win/rich-presence-qt_windows_\(portable\).exe .
          windeployqt6 dist-win/rich-presence-qt_windows_\(portable\).exe

      - name: Zip portable
        shell: pwsh
        run: Compress-Archive -Path dist-win\* -DestinationPath "rich-presence-qt_windows_(portable).zip"

      - uses: actions/upload-artifact@v4
        with:
          name: rich-presence-qt_windows
          path: rich-presence-qt_windows.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: rich-presence-qt_windows_(portable)
          path: rich-presence-qt_windows_(portable).zip
          if-no-files-found: error

  prerelease:
    needs: [version, build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          chmod +x dist/rich-presence-qt_linux dist/rich-presence-qt_macOS.app "dist/rich-presence-qt_linux_(portable)" || true
          NOTES="Pre-release ${TAG} from ${GITHUB_SHA}."$'\n\n'
          NOTES+="- \`rich-presence-qt_linux\` — Linux x86_64"$'\n'
          NOTES+="- \`rich-presence-qt_linux_(portable)\` — Linux x86_64 AppImage (bundled Qt)"$'\n'
          NOTES+="- \`rich-presence-qt_macOS.app\` — macOS (Apple Silicon)"$'\n'
          NOTES+="- \`rich-presence-qt_macOS_(portable).app.zip\` — macOS app bundle (bundled Qt)"$'\n'
          NOTES+="- \`rich-presence-qt_windows.exe\` — Windows x86_64"$'\n'
          NOTES+="- \`rich-presence-qt_windows_(portable).zip\` — Windows x86_64 (\`rich-presence-qt_windows_(portable).exe\` + Qt DLLs)"
          gh release create "$TAG" \
            --prerelease \
            --title "$TAG" \
            --notes "$NOTES" \
            dist/rich-presence-qt_linux \
            "dist/rich-presence-qt_linux_(portable)" \
            dist/rich-presence-qt_macOS.app \
            "dist/rich-presence-qt_macOS_(portable).app.zip" \
            dist/rich-presence-qt_windows.exe \
            "dist/rich-presence-qt_windows_(portable).zip" \
            logo.png rich-presence-u.desktop
