name: Pre-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^const VERSION = "\(.*\)"/\1/p' svc/version.go | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read VERSION from svc/version.go"
            exit 1
          fi
          case "$VERSION" in
            v*) TAG="$VERSION" ;;
            *)  TAG="v$VERSION" ;;
          esac
          echo "VERSION=$VERSION"
          echo "TAG=$TAG"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump VERSION in svc/version.go."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump VERSION in svc/version.go."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ pkg-config qt6-base-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -o app .

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --prerelease \
            --title "$TAG" \
            --notes "Pre-release ${TAG} from ${GITHUB_SHA}." \
            app logo.png rich-presence-u.desktop
