name: Update IGDB Platforms

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-platforms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch platforms and generate igdb/platforms.go
        env:
          IGDB_ID: ${{ secrets.IGDB_ID }}
          IGDB_SECRET: ${{ secrets.IGDB_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${IGDB_ID:-}" ] || [ -z "${IGDB_SECRET:-}" ]; then
            echo "::error::IGDB_ID and IGDB_SECRET secrets must be set"
            exit 1
          fi

          echo "Requesting access token..."
          TOKEN_JSON=$(curl -sS -X POST \
            "https://id.twitch.tv/oauth2/token?client_id=${IGDB_ID}&client_secret=${IGDB_SECRET}&grant_type=client_credentials")
          ACCESS_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Failed to obtain access token"
            echo "$TOKEN_JSON"
            exit 1
          fi
          echo "Access token obtained."

          # Fetch all platforms (currently ~220, well under limit 500)
          # Nested field platform_family.name expands the family name
          QUERY='fields id,name,platform_family.name; limit 500; sort id asc;'
          echo "Querying platforms..."
          curl -sS -X POST "https://api.igdb.com/v4/platforms" \
            -H "Client-ID: ${IGDB_ID}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            -d "$QUERY" > /tmp/platforms.json

          COUNT=$(jq 'length' /tmp/platforms.json)
          echo "Received ${COUNT} platforms."

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No platforms returned"
            cat /tmp/platforms.json
            exit 1
          fi

          # Generate the Go source. Sorted by manufacturer name, then by ID within each group
          # so that pure reordering never produces a commit.
          python3 << 'PY'
          import json
          from collections import defaultdict

          with open("/tmp/platforms.json") as f:
              platforms = json.load(f)

          # group: manufacturer -> list of (id, name)
          groups = defaultdict(list)
          for p in platforms:
              fam = p.get("platform_family") or {}
              manufacturer = fam.get("name") if isinstance(fam, dict) else None
              if not manufacturer:
                  manufacturer = "Other"
              name = p.get("name") or f"Platform {p['id']}"
              groups[manufacturer].append((p["id"], name))

          # sort manufacturers alphabetically, platforms inside by ID ascending
          sorted_mfrs = sorted(groups.keys())

          lines = []
          lines.append("// Code generated by .github/workflows/update-igdb-platforms.yml; DO NOT EDIT.")
          lines.append("// Run the \"Update IGDB Platforms\" workflow to refresh.")
          lines.append("package igdb")
          lines.append("")
          lines.append("type PlatformID int")
          lines.append("")
          lines.append("// Platforms maps manufacturer -> console name -> IGDB platform ID.")
          lines.append("// Generated from the IGDB /platforms endpoint, sorted by ID for stable diffs.")
          lines.append("var Platforms = map[string]map[string]PlatformID{")

          for mfr in sorted_mfrs:
              items = sorted(groups[mfr], key=lambda t: t[0])  # by ID
              lines.append(f'\t"{mfr}": {{')
              for pid, name in items:
                  # Escape for Go string literal
                  esc = name.replace("\\", "\\\\").replace('"', '\\"')
                  lines.append(f'\t\t"{esc}": {pid},')
              lines.append("\t},")

          lines.append("}")
          lines.append("")

          content = "\n".join(lines)

          import os
          os.makedirs("igdb", exist_ok=True)
          with open("igdb/platforms.go", "w") as f:
              f.write(content)

          print(f"Wrote igdb/platforms.go with {sum(len(v) for v in groups.values())} platforms across {len(groups)} manufacturers.")
          PY

      - name: Commit and push only if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ ! -f igdb/platforms.go ]; then
            echo "::error::igdb/platforms.go was not generated"
            exit 1
          fi

          # Ensure we are on the default branch and up to date
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the file
          git add igdb/platforms.go

          # Check if there is anything to commit (new file or content change)
          if git diff --cached --quiet; then
            echo "No changes to igdb/platforms.go — nothing to commit."
            exit 0
          fi

          git commit -m "chore(igdb): update platforms.go from IGDB API"
          git push origin HEAD:${{ github.ref_name }}
          echo "Pushed updated igdb/platforms.go"
